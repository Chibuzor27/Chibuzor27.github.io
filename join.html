<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <link rel="stylesheet" href="css/style.css"/>
        <link rel="stylesheet" href="icon-linear/css/fontello.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <title>Quell Publishers</title>
    </head>
    <body class="site">
        <div class="purple-box vh-100"></div>

        <div class="d-flex align-items-center" style="height: 100vh;">
            <div class="container">
                <div class="row d-flex justify-content-center align-content-center">
                    <div class="col-lg-12 col-md-9">
                        <div class="card rounded-0">
                            <div class="row g-0">
                                <div class="col-lg-6 col-md-12">
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-12">
                                                <div class="px-5 pt-5 pb-4"><a href="index.html"><img src="img/logo-demo.png" width="70"/></a></div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-12">
                                                <div class="px-4 pb-4 px-lg-5 pb-lg-5">
                                                    <div class="p-2">
                                                        <h5 class="card-title"><strong>Create Account</strong></h5>
                                                        <p class="card-text text-start">Join us today! Create your account to start exploring a world of ebooks</p>    
                                                    </div>

                                                    <div class="d-grid py-4">
                                                        <button type="submit" class="btn btn-outline-primary"><span class="bi bi-google"></span> Continue with google</button>
                                                    </div>

                                                    <div class="">
                                                        <div class="row d-flex">
                                                            <div class="col"><hr /></div>
                                                            <div class="col-auto">
                                                                <div class="text-muted">Or create account with email</div>
                                                            </div>
                                                            <div class="col"><hr /></div>
                                                        </div>
                                                        <form class="row g-4">
                                                            <div class="col-lg-12">
                                                                <label for="joinEamil" class="form-label"><strong>Email</strong></label>
                                                                <input type="text" class="form-control" id="joinEamil" placeholder="Youremail@gmail.com">
                                                            </div>
                                                            <div class="col-lg-12">
                                                                <label for="joinPassword" class="form-label"><strong>Password</strong></label>
                                                                <input type="password" class="form-control" id="joinPassword" placeholder="********">
                                                            </div>
                                                            <div class="col-lg-12">
                                                                <label for="joinConfirmPassword" class="form-label"><strong>Confirm Password</strong></label>
                                                                <input type="password" class="form-control" id="joinConfirmPassword" placeholder="********">
                                                            </div>
                                                            <div class="col-12">
                                                                <div class="d-grid my-2">
                                                                    <button type="submit" class="btn btn-primary">Create account</button>
                                                                </div>
                                                            </div>
                                                        </form>
                                                        
                                                        <div class="row g-4">
                                                            <div class="col-12">
                                                                <div class="d-flex justify-content-center">
                                                                    <a href="login.html" class="text-primary">Sign in</a>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        <!-- <hr />
                                                        Or create account with email
                                                        <hr /> -->
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6 d-none d-lg-block">
                                    <img src="img/sign.png" class="img-fluid h-100"/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script src="js/script.js"></script>
    </body>
</html>
